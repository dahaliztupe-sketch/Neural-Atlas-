<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 — Page Not Found | Neural Atlas</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #050811;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 520px;
        width: 100%;
        padding: 36px 28px;
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.2);
        text-align: center;
      }
      .code {
        display: inline-block;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        color: #22d3ee;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.25;
      }
      p {
        margin: 0 0 24px;
        color: #94a3b8;
        font-size: 15px;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 22px;
        border-radius: 12px;
        background: #22d3ee;
        color: #050811;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
      }
      a:hover {
        background: #67e8f9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404 // ROUTE NOT FOUND</div>
      <h1>Page Not Found</h1>
      <p>
        The page you requested does not exist on Neural Atlas or may have moved.
        Return to the main overview to explore verified coursework, projects, and notes.
      </p>
      <a href="/">Return Home</a>
    </main>
  </body>
</html>
