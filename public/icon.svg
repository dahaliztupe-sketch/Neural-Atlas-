<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Neural Atlas emblem">
  <defs>
    <linearGradient id="naObsidianBg" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="naPrismStroke" x1="128" y1="104" x2="384" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="naPrismFacet" x1="256" y1="104" x2="376" y2="268" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="naCoreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Obsidian Squircle Chassis -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#naObsidianBg)" stroke="#94a3b8" stroke-opacity="0.22" stroke-width="6"/>
  <circle cx="256" cy="256" r="188" fill="url(#naCoreHalo)"/>

  <!-- Calibrated Astrolabe Ring & Cardinal Ticks -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#94a3b8" stroke-opacity="0.28" stroke-width="4.5"/>
  <circle cx="256" cy="256" r="154" fill="none" stroke="#8b5cf6" stroke-opacity="0.22" stroke-width="2.5" stroke-dasharray="6 14"/>
  <path d="M256 54V86M256 426V458M54 256H86M426 256H458" stroke="#22d3ee" stroke-opacity="0.72" stroke-width="8" stroke-linecap="round"/>

  <!-- Inclined Elliptical Gimbal Arc -->
  <ellipse cx="256" cy="256" rx="152" ry="68" transform="rotate(-28 256 256)" fill="none" stroke="url(#naPrismStroke)" stroke-opacity="0.58" stroke-width="6.5"/>

  <!-- Central Octahedral Crystal -->
  <polygon points="256,104 374,256 256,256" fill="url(#naPrismFacet)"/>
  <polygon points="256,104 374,256 256,408 138,256" fill="none" stroke="url(#naPrismStroke)" stroke-width="11" stroke-linejoin="round"/>
  <path d="M256 104V408M138 256H374" stroke="url(#naPrismStroke)" stroke-opacity="0.68" stroke-width="6" stroke-linecap="round"/>

  <!-- Core Node & Anchor Vertices -->
  <circle cx="256" cy="256" r="24" fill="#050811" stroke="#f8fafc" stroke-width="9"/>
  <circle cx="256" cy="104" r="13" fill="#22d3ee"/>
  <circle cx="374" cy="256" r="13" fill="#8b5cf6"/>
  <circle cx="138" cy="256" r="13" fill="#38bdf8"/>
  <circle cx="256" cy="408" r="11" fill="#a78bfa"/>
</svg>
